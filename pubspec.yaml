name: mahameek
description: "تطبيق محاميك - ابحث عن محامٍ في مدينتك"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.3

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Utilities
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.4
  crypto: ^3.0.7
  http: ^1.2.2
  googleapis_auth: ^1.6.0
  wakelock_plus: ^1.8.0
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - imag/IMG_4151.PNG
    - imag/IMG_4158.PNG
    - imag/5818738877521400103.jpg
    - assets/images/
    - assets/images/cities/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
