name: Build iOS IPA (No Mac / Free Sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 💙 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🍎 Build iOS (Unsigned Release)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign -v 2>&1 | tee flutter_build.log || (echo "=== XCODE / FLUTTER BUILD FAILED - LAST 100 LINES ===" && tail -n 100 flutter_build.log && exit 1)

      - name: 📦 Package into IPA (Payload Structure)
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -9 Mahameek-unsigned.ipa Payload
          cd ../../..

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mahameek-iOS-IPA
          path: build/ios/iphoneos/Mahameek-unsigned.ipa
          retention-days: 14

      - name: 📋 Post Failure Summary to Job Page
        if: failure()
        run: |
          echo "### ❌ Build Failure Diagnostics (Last 120 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f flutter_build.log ]; then
            tail -n 120 flutter_build.log >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Specific Errors Found in Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f flutter_build.log ]; then
            grep -E -C 2 "(error:|fatal error:|BUILD FAILED|The following build commands failed)" flutter_build.log | head -n 100 >> $GITHUB_STEP_SUMMARY || echo "No explicit error pattern matched." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 📋 Upload Full Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-logs
          path: flutter_build.log
          if-no-files-found: ignore
