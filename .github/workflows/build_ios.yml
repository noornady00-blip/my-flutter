name: Build iOS IPA (No Mac / Free Sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 💙 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🍎 CocoaPods Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🍎 Build iOS (Unsigned Release)
        run: |
          flutter build ios --release --no-codesign --verbose

      - name: 📦 Package into IPA (Payload Structure)
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -9 Mahameek-unsigned.ipa Payload
          cd ../../..

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mahameek-iOS-IPA
          path: build/ios/iphoneos/Mahameek-unsigned.ipa
          retention-days: 14

      - name: 📋 Upload Diagnostic Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build/ios/archive/*.xcresult
            ios/Podfile.lock
            ios/Pods/Manifest.lock
